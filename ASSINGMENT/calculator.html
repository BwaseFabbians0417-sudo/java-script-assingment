<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="calculator.css" />
  </head>
  <body>
    <div class="calculator-container">
      <div class="calculator">
        <input id="display" type="text" readonly value="0" />
        <div class="buttons">
          <button class="btn clear">C</button>
          <button class="btn delete">DEL</button>
          <button class="btn operator divide">÷</button>
          <button class="btn operator multiply">×</button>
          <button class="btn number">7</button>
          <button class="btn number">8</button>
          <button class="btn number">9</button>
          <button class="btn operator multiply">×</button>
          <button class="btn number">4</button>
          <button class="btn number">5</button>
          <button class="btn number">6</button>
          <button class="btn operator minus">−</button>
          <button class="btn number">1</button>
          <button class="btn number">2</button>
          <button class="btn number">3</button>
          <button class="btn operator plus">+</button>
          <button class="btn number zero">0</button>
          <button class="btn equals">=</button>
        </div>
      </div>
    </div>
  </body>
</html>
