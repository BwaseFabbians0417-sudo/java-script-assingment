<!DOCTYPE html>
<html lang="en">
<head>
<body>
    <main class="form-wrapper">
        <p class="eyebrow">Join our community</p>
        <h1>Create your account</h1>
        <p class="intro">Fill in your details below to get started.</p>

        <form action="#" method="post">
            <div class="field-row">
                <div>
                    <label for="first-name">First name</label>
                    <input type="text" id="first-name" name="first_name" autocomplete="given-name" required>
                </div>
                <div>
                    <label for="last-name">Last name</label>
                    <input type="text" id="last-name" name="last_name" autocomplete="family-name" required>
                </div>
            </div>

            <div>
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" autocomplete="email" required>
            </div>

            <div class="field-row">
                <div>
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" minlength="8" autocomplete="new-password" required>
                </div>
                <div>
                    <label for="confirm-password">Confirm password</label>
                    <input type="password" id="confirm-password" name="confirm_password" minlength="8" autocomplete="new-password" required>
                </div>
            </div>

            <div>
                <label for="country">Country</label>
                <select id="country" name="country" required>
                    <option value="">Select your country</option>
                    <option value="nigeria">Nigeria</option>
                    <option value="ghana">Ghana</option>
                    <option value="kenya">Kenya</option>
                    <option value="south-africa">South Africa</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <fieldset>
                <legend>Preferred contact method</legend>
                <div class="options">
                    <label class="option"><input type="radio" name="contact_method" value="email" checked> Email</label>
                    <label class="option"><input type="radio" name="contact_method" value="phone"> Phone</label>
                </div>
            </fieldset>

            <label class="terms">
                <input type="checkbox" name="terms" required>
                <span>I agree to the terms and conditions.</span>
            </label>

            <button type="submit">Create account</button>
        </form>
    </main>
</body>
</html>
